<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 Active Inventory · Clean Management</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1b33;
      padding: 1rem;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
      padding: 1.5rem;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #eef2f6;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand i {
      font-size: 1.75rem;
      color: #2563eb;
      background: #e0edff;
      padding: 0.5rem;
      border-radius: 12px;
    }

    .brand h1 {
      font-weight: 700;
      font-size: 1.5rem;
      color: #0b1b33;
    }

    .brand small {
      font-weight: 400;
      font-size: 0.8rem;
      color: #64748b;
    }

    .status-badge {
      background: #e6f7ec;
      color: #0e6b3e;
      padding: 0.4rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid #b6e0c9;
    }

    /* Stats - 4 column grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #f9faff;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      border: 1px solid #e9edf4;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-card:hover {
      background: white;
      border-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37,99,235,0.1);
    }

    .stat-card.active {
      background: #e5efff;
      border-color: #2563eb;
    }

    .stat-info .stat-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      color: #64748b;
      display: block;
    }

    .stat-info .stat-value {
      font-weight: 700;
      font-size: 1.5rem;
      color: #0b1b33;
      line-height: 1.2;
    }

    .stat-icon {
      font-size: 1.5rem;
      opacity: 0.5;
      color: #2563eb;
    }

    /* Toolbar - stacked on mobile */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #dce2ec;
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1rem;
      transition: 0.15s;
    }

    .search-box:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .search-box i {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .search-box input {
      border: none;
      padding: 0.5rem 0.5rem;
      font-size: 0.85rem;
      width: 100%;
      background: transparent;
      outline: none;
      font-weight: 500;
    }

    .search-box input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .filter-group {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.3rem 0.8rem;
      border: 1px solid #dce2ec;
      background: white;
      border-radius: 60px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: #475569;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: #f1f5f9;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }

    .btn {
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 2px 8px -2px rgba(37,99,235,0.25);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #dce2ec;
      color: #475569;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn-danger-outline {
      background: transparent;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .btn-danger-outline:hover {
      background: #fee9e9;
    }

    /* Product Cards - replaces table */
    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 65vh;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .product-grid::-webkit-scrollbar {
      width: 6px;
    }

    .product-grid::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }

    .product-grid::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .product-card {
      background: white;
      border: 1px solid #eef2f6;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      transition: all 0.15s;
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      gap: 0.75rem;
      align-items: center;
    }

    .product-card:hover {
      border-color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .product-card.selected {
      background: #e5efff;
      border-color: #2563eb;
    }

    .product-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2563eb;
      flex-shrink: 0;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .product-avatar {
      width: 36px;
      height: 36px;
      background: #e2eaf8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .product-details {
      min-width: 0;
    }

    .product-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #0b1b33;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.7rem;
      color: #64748b;
    }

    .product-meta .sku {
      background: #f1f5f9;
      padding: 0.1rem 0.5rem;
      border-radius: 30px;
    }

    .product-quantity {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .product-quantity .bar {
      width: 60px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .product-quantity .bar .fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s;
    }

    .product-quantity .bar .fill.high { background: #16a34a; }
    .product-quantity .bar .fill.medium { background: #eab308; }
    .product-quantity .bar .fill.low { background: #dc2626; }

    .product-status {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 60px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .product-status.active {
      background: #dcfce7;
      color: #166534;
    }

    .product-status.low {
      background: #fef3c7;
      color: #92400e;
    }

    .product-status.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .product-actions {
      display: flex;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .product-actions .action-btn {
      padding: 0.25rem 0.5rem;
      border: none;
      background: transparent;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #64748b;
      font-size: 0.8rem;
    }

    .product-actions .action-btn:hover {
      background: #f1f5f9;
      color: #0b1b33;
    }

    .product-actions .action-btn.edit:hover {
      background: #dbeafe;
      color: #2563eb;
    }

    .product-actions .action-btn.delete:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* Bulk Actions */
    .bulk-actions {
      display: none;
      background: #e5efff;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .bulk-actions.show {
      display: flex;
    }

    .bulk-actions .bulk-info {
      font-weight: 500;
      font-size: 0.85rem;
      color: #1e293b;
    }

    .bulk-actions .btn {
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
    }

    .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .empty-state h3 {
      color: #1e293b;
      margin-bottom: 0.25rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      padding: 1rem;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      border-radius: 1.5rem;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 1.25rem 1.5rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eef2f6;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #94a3b8;
      transition: color 0.15s;
    }

    .modal-close:hover {
      color: #1e293b;
    }

    .modal-body {
      padding: 1.25rem 1.5rem;
    }

    .modal-footer {
      padding: 0.75rem 1.5rem 1.25rem;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      border-top: 1px solid #eef2f6;
    }

    .form-group {
      margin-bottom: 0.75rem;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      font-size: 0.8rem;
      color: #1e293b;
      margin-bottom: 0.2rem;
    }

    .form-group .required {
      color: #dc2626;
    }

    .form-control {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #dce2ec;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      transition: all 0.15s;
      background: #fafcff;
      font-family: 'Inter', sans-serif;
    }

    .form-control:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: white;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    /* Footer */
    .footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #eef2f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .footer i {
      color: #2563eb;
      margin-right: 0.2rem;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .page-btn {
      padding: 0.2rem 0.6rem;
      border: 1px solid #dce2ec;
      background: white;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.15s;
      color: #475569;
    }

    .page-btn:hover {
      background: #f1f5f9;
    }

    .page-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 350px;
      width: 100%;
    }

    .toast {
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      border-left: 4px solid #2563eb;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideIn 0.25s ease;
    }

    .toast.success { border-left-color: #16a34a; }
    .toast.error { border-left-color: #dc2626; }
    .toast.warning { border-left-color: #eab308; }

    .toast i { font-size: 1.1rem; }
    .toast .toast-content { flex: 1; }
    .toast .toast-title { font-weight: 600; font-size: 0.85rem; }
    .toast .toast-message { font-size: 0.78rem; color: #64748b; }
    .toast .toast-close { background: none; border: none; cursor: pointer; color: #94a3b8; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Mobile Responsive */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 1rem;
        border-radius: 1rem;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .stat-card {
        padding: 0.5rem 0.75rem;
      }

      .stat-info .stat-value {
        font-size: 1.2rem;
      }

      .stat-icon {
        font-size: 1.2rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        min-width: unset;
      }

      .filter-group {
        justify-content: center;
      }

      .toolbar-actions {
        margin-left: 0;
        justify-content: center;
      }

      .product-card {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        padding: 0.75rem;
      }

      .product-info {
        width: 100%;
      }

      .product-quantity {
        width: 100%;
        justify-content: flex-start;
      }

      .product-status {
        width: fit-content;
      }

      .product-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .brand h1 {
        font-size: 1.2rem;
      }

      .brand small {
        display: none;
      }

      .status-badge {
        font-size: 0.7rem;
        padding: 0.3rem 0.7rem;
      }

      .btn span {
        display: none;
      }

      .btn {
        padding: 0.4rem 0.7rem;
      }

      .product-name {
        font-size: 0.85rem;
      }

      .product-meta {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <i class="fas fa-cubes"></i>
        <div>
          <h1>Inventrix <small>· inventory</small></h1>
        </div>
      </div>
      <div class="status-badge">
        <i class="fas fa-circle" style="font-size: 0.5rem;"></i> live
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card active" data-filter="all">
        <div class="stat-info">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-icon"><i class="fas fa-boxes"></i></div>
      </div>
      <div class="stat-card" data-filter="active">
        <div class="stat-info">
          <span class="stat-label">Active</span>
          <span class="stat-value" id="activeCount">0</span>
        </div>
        <div class="stat-icon"><i class="fas fa-check-circle" style="color: #16a34a;"></i></div>
      </div>
      <div class="stat-card" data-filter="low">
        <div class="stat-info">
          <span class="stat-label">Low Stock</span>
          <span class="stat-value" id="lowStockCount">0</span>
        </div>
        <div class="stat-icon"><i class="fas fa-exclamation-triangle" style="color: #eab308;"></i></div>
      </div>
      <div class="stat-card" data-filter="inactive">
        <div class="stat-info">
          <span class="stat-label">Inactive</span>
          <span class="stat-value" id="inactiveCount">0</span>
        </div>
        <div class="stat-icon"><i class="fas fa-times-circle" style="color: #94a3b8;"></i></div>
      </div>
    </div>

    <!-- Bulk Actions -->
    <div class="bulk-actions" id="bulkActions">
      <span class="bulk-info" id="bulkInfo">0 selected</span>
      <button class="btn btn-primary btn-sm" id="bulkActive"><i class="fas fa-check"></i> Active</button>
      <button class="btn btn-outline btn-sm" id="bulkLow"><i class="fas fa-exclamation"></i> Low</button>
      <button class="btn btn-danger-outline btn-sm" id="bulkDelete"><i class="fas fa-trash"></i> Delete</button>
      <button class="btn btn-outline btn-sm" id="bulkClear"><i class="fas fa-times"></i> Clear</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search name, SKU, or description...">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="low">Low Stock</button>
        <button class="filter-btn" data-filter="inactive">Inactive</button>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-outline" id="exportBtn"><i class="fas fa-download"></i> <span>Export</span></button>
        <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> <span>Add</span></button>
      </div>
    </div>

    <!-- Product List -->
    <div class="product-grid" id="productGrid">
      <!-- Products rendered here -->
    </div>

    <!-- Footer -->
    <div class="footer">
      <span><i class="fas fa-database"></i> <span id="itemCount">0</span> items · auto-saved</span>
      <div class="pagination">
        <button class="page-btn" id="prevPage"><i class="fas fa-chevron-left"></i></button>
        <span id="pageInfo">1 / 1</span>
        <button class="page-btn" id="nextPage"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <div class="form-row">
            <div class="form-group">
              <label>Name <span class="required">*</span></label>
              <input type="text" class="form-control" id="productName" placeholder="Product name" required>
            </div>
            <div class="form-group">
              <label>SKU <span class="required">*</span></label>
              <input type="text" class="form-control" id="productSku" placeholder="SKU-1234" required>
            </div>
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" class="form-control" id="productDesc" placeholder="Brief description">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Quantity <span class="required">*</span></label>
              <input type="number" class="form-control" id="productQty" min="0" value="1" required>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select class="form-control" id="productStatus">
                <option value="active">Active</option>
                <option value="low">Low Stock</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select class="form-control" id="productCategory">
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Office">Office</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Supplier</label>
              <input type="text" class="form-control" id="productSupplier" placeholder="Supplier name">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Cost ($)</label>
              <input type="number" class="form-control" id="productCost" min="0" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
              <label>Price ($)</label>
              <input type="number" class="form-control" id="productPrice" min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="form-group">
            <label>Reorder Point</label>
            <input type="number" class="form-control" id="productReorder" min="0" value="5">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="cancelModalBtn">Cancel</button>
        <button class="btn btn-primary" id="saveProductBtn"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      'use strict';

      // ---------- DATA ----------
      let items = [
        { id: 'p1', name: 'Ergonomic Keyboard', sku: 'KB-2025', quantity: 12, status: 'active', category: 'Electronics', supplier: 'TechPro', description: 'Mechanical keyboard' },
        { id: 'p2', name: 'USB-C Hub 7-in-1', sku: 'HUB-C7', quantity: 4, status: 'low', category: 'Accessories', supplier: 'ConnectTech', description: 'Multi-port hub' },
        { id: 'p3', name: 'Bluetooth Speaker', sku: 'SPK-BT5', quantity: 0, status: 'inactive', category: 'Electronics', supplier: 'AudioWave', description: 'Portable speaker' },
        { id: 'p4', name: 'Wireless Mouse', sku: 'MSE-WL3', quantity: 8, status: 'active', category: 'Accessories', supplier: 'TechPro', description: 'Ergonomic mouse' },
        { id: 'p5', name: 'HDMI Cable 2m', sku: 'CBL-HD2', quantity: 2, status: 'low', category: 'Accessories', supplier: 'CableMaster', description: 'High-speed HDMI' },
        { id: 'p6', name: 'Laptop Stand', sku: 'STD-LP1', quantity: 15, status: 'active', category: 'Furniture', supplier: 'ErgoWorks', description: 'Adjustable stand' },
        { id: 'p7', name: 'Charging Pad', sku: 'WCH-PD1', quantity: 6, status: 'active', category: 'Electronics', supplier: 'ChargeTech', description: 'Wireless charger' },
        { id: 'p8', name: 'USB-C Adapter', sku: 'ADP-CU2', quantity: 0, status: 'inactive', category: 'Accessories', supplier: 'ConnectTech', description: 'USB-C to USB' },
        { id: 'p9', name: 'Switch Tester', sku: 'SWT-MK1', quantity: 1, status: 'low', category: 'Accessories', supplier: 'SwitchLab', description: 'Key switch tester' },
        { id: 'p10', name: 'Monitor Mount', sku: 'MNT-ARM2', quantity: 9, status: 'active', category: 'Furniture', supplier: 'ErgoWorks', description: 'Gas spring mount' },
        { id: 'p11', name: 'Ethernet Cable 5m', sku: 'ETH-CAT6', quantity: 25, status: 'active', category: 'Accessories', supplier: 'CableMaster', description: 'CAT6 cable' },
        { id: 'p12', name: 'Desk Fan', sku: 'FAN-USB1', quantity: 7, status: 'active', category: 'Electronics', supplier: 'CoolTech', description: 'USB fan' }
      ];

      let nextId = 13;
      let currentFilter = 'all';
      let searchQuery = '';
      let selectedItems = new Set();
      let currentPage = 1;
      let itemsPerPage = 8;
      let editingId = null;

      // ---------- DOM REFS ----------
      const grid = document.getElementById('productGrid');
      const totalSpan = document.getElementById('totalCount');
      const activeSpan = document.getElementById('activeCount');
      const lowSpan = document.getElementById('lowStockCount');
      const inactiveSpan = document.getElementById('inactiveCount');
      const itemCountSpan = document.getElementById('itemCount');
      const searchInput = document.getElementById('searchInput');
      const addBtn = document.getElementById('addProductBtn');
      const exportBtn = document.getElementById('exportBtn');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const statCards = document.querySelectorAll('.stat-card');
      const prevPageBtn = document.getElementById('prevPage');
      const nextPageBtn = document.getElementById('nextPage');
      const pageInfo = document.getElementById('pageInfo');
      const bulkActions = document.getElementById('bulkActions');
      const bulkInfo = document.getElementById('bulkInfo');
      const bulkActive = document.getElementById('bulkActive');
      const bulkLow = document.getElementById('bulkLow');
      const bulkDelete = document.getElementById('bulkDelete');
      const bulkClear = document.getElementById('bulkClear');

      // Modal
      const modal = document.getElementById('productModal');
      const modalTitle = document.getElementById('modalTitle');
      const form = document.getElementById('productForm');
      const nameInput = document.getElementById('productName');
      const skuInput = document.getElementById('productSku');
      const descInput = document.getElementById('productDesc');
      const qtyInput = document.getElementById('productQty');
      const statusSelect = document.getElementById('productStatus');
      const categorySelect = document.getElementById('productCategory');
      const supplierInput = document.getElementById('productSupplier');
      const costInput = document.getElementById('productCost');
      const priceInput = document.getElementById('productPrice');
      const reorderInput = document.getElementById('productReorder');
      const saveBtn = document.getElementById('saveProductBtn');
      const cancelBtn = document.getElementById('cancelModalBtn');
      const closeBtn = document.getElementById('closeModalBtn');

      // ---------- HELPERS ----------
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function getInitials(name) {
        return name ? name.charAt(0).toUpperCase() : '?';
      }

      function getStatusClass(status) {
        return status || 'inactive';
      }

      function getStatusIcon(status) {
        const map = { active: 'fa-check-circle', low: 'fa-exclamation-triangle', inactive: 'fa-times-circle' };
        return map[status] || 'fa-circle';
      }

      function getBarClass(quantity, reorderPoint) {
        const max = reorderPoint * 3 || 10;
        const percent = Math.min((quantity / max) * 100, 100);
        if (percent > 70) return 'high';
        if (percent > 30) return 'medium';
        return 'low';
      }

      function getBarWidth(quantity, reorderPoint) {
        const max = reorderPoint * 3 || 10;
        return Math.min((quantity / max) * 100, 100);
      }

      // ---------- TOAST ----------
      function showToast(title, message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = {
          success: 'fas fa-check-circle',
          error: 'fas fa-exclamation-circle',
          warning: 'fas fa-exclamation-triangle',
          info: 'fas fa-info-circle'
        };
        toast.innerHTML = `
          <i class="${icons[type] || icons.info}"></i>
          <div class="toast-content">
            <div class="toast-title">${escapeHtml(title)}</div>
            <div class="toast-message">${escapeHtml(message)}</div>
          </div>
          <button class="toast-close"><i class="fas fa-times"></i></button>
        `;
        container.appendChild(toast);
        toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3500);
      }

      // ---------- SAVE/LOAD ----------
      function saveData() {
        try {
          localStorage.setItem('inventoryData', JSON.stringify(items));
        } catch (e) {}
      }

      function loadData() {
        try {
          const data = localStorage.getItem('inventoryData');
          if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed) && parsed.length > 0) {
              items = parsed;
              return true;
            }
          }
        } catch (e) {}
        return false;
      }

      loadData();

      // ---------- RENDER ----------
      function render() {
        // Filter
        let filtered = [...items];
        if (currentFilter === 'active') {
          filtered = filtered.filter(i => i.status === 'active');
        } else if (currentFilter === 'low') {
          filtered = filtered.filter(i => i.quantity <= 5 && i.status !== 'inactive');
        } else if (currentFilter === 'inactive') {
          filtered = filtered.filter(i => i.status === 'inactive');
        }

        // Search
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          filtered = filtered.filter(i =>
            i.name.toLowerCase().includes(q) ||
            i.sku.toLowerCase().includes(q) ||
            (i.description && i.description.toLowerCase().includes(q)) ||
            (i.supplier && i.supplier.toLowerCase().includes(q))
          );
        }

        // Stats
        const total = items.length;
        const active = items.filter(i => i.status === 'active').length;
        const low = items.filter(i => i.quantity <= 5 && i.status !== 'inactive').length;
        const inactive = items.filter(i => i.status === 'inactive').length;
        totalSpan.textContent = total;
        activeSpan.textContent = active;
        lowSpan.textContent = low;
        inactiveSpan.textContent = inactive;
        itemCountSpan.textContent = filtered.length;

        // Update stats cards
        statCards.forEach(card => {
          const filter = card.dataset.filter;
          card.classList.toggle('active', filter === currentFilter);
        });

        // Update filter buttons
        filterBtns.forEach(btn => {
          const filter = btn.dataset.filter;
          btn.classList.toggle('active', filter === currentFilter);
        });

        // Pagination
        const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, filtered.length);
        const pageItems = filtered.slice(start, end);

        pageInfo.textContent = `${currentPage} / ${totalPages}`;
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages;

        // Bulk actions
        const selectedCount = selectedItems.size;
        if (selectedCount > 0) {
          bulkActions.classList.add('show');
          bulkInfo.textContent = `${selectedCount} selected`;
        } else {
          bulkActions.classList.remove('show');
        }

        // Render cards
        if (pageItems.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <h3>No items found</h3>
              <p>Try adjusting your search or add a new product.</p>
            </div>
          `;
          return;
        }

        let html = '';
        for (const item of pageItems) {
          const isSelected = selectedItems.has(item.id);
          const statusClass = getStatusClass(item.status);
          const barClass = getBarClass(item.quantity, item.reorderPoint || 5);
          const barWidth = getBarWidth(item.quantity, item.reorderPoint || 5);
          const initial = getInitials(item.name);

          html += `
            <div class="product-card ${isSelected ? 'selected' : ''}">
              <input type="checkbox" class="product-checkbox" data-id="${item.id}" ${isSelected ? 'checked' : ''}>

              <div class="product-info">
                <div class="product-avatar">${initial}</div>
                <div class="product-details">
                  <span class="product-name">${escapeHtml(item.name)}</span>
                  <div class="product-meta">
                    <span class="sku">${escapeHtml(item.sku)}</span>
                    ${item.category ? `<span>${escapeHtml(item.category)}</span>` : ''}
                    ${item.supplier ? `<span>· ${escapeHtml(item.supplier)}</span>` : ''}
                  </div>
                </div>
              </div>

              <div class="product-quantity">
                <span>${item.quantity}</span>
                <div class="bar">
                  <div class="fill ${barClass}" style="width: ${barWidth}%;"></div>
                </div>
              </div>

              <span class="product-status ${statusClass}">
                <i class="fas ${getStatusIcon(item.status)}"></i> ${item.status}
              </span>

              <div class="product-actions">
                <button class="action-btn edit" data-id="${item.id}" data-action="edit" title="Edit"><i class="fas fa-pen"></i></button>
                <button class="action-btn" data-id="${item.id}" data-action="duplicate" title="Duplicate"><i class="fas fa-copy"></i></button>
                <button class="action-btn" data-id="${item.id}" data-action="toggle" title="Toggle Status"><i class="fas fa-sync-alt"></i></button>
                <button class="action-btn delete" data-id="${item.id}" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          `;
        }
        grid.innerHTML = html;

        saveData();
      }

      // ---------- ACTIONS ----------
      function addItem(data) {
        const newItem = {
          id: `p${nextId++}`,
          name: data.name.trim(),
          sku: data.sku.trim(),
          quantity: parseInt(data.quantity) || 0,
          status: data.status || 'active',
          category: data.category || 'Other',
          supplier: data.supplier || '',
          description: data.description || '',
          cost: parseFloat(data.cost) || 0,
          price: parseFloat(data.price) || 0,
          reorderPoint: parseInt(data.reorderPoint) || 5
        };
        items = [newItem, ...items];
        render();
        showToast('Added', `${newItem.name} added successfully`, 'success');
        return newItem;
      }

      function updateItem(id, data) {
        let updated = null;
        items = items.map(item => {
          if (item.id === id) {
            updated = { ...item, ...data };
            return updated;
          }
          return item;
        });
        if (updated) {
          render();
          showToast('Updated', `${updated.name} updated successfully`, 'success');
        }
        return updated;
      }

      function deleteItem(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        items = items.filter(i => i.id !== id);
        selectedItems.delete(id);
        render();
        showToast('Deleted', `${item.name} removed`, 'info');
      }

      function deleteItems(ids) {
        const count = ids.length;
        items = items.filter(i => !ids.includes(i.id));
        ids.forEach(id => selectedItems.delete(id));
        render();
        showToast('Deleted', `${count} items removed`, 'info');
      }

      function toggleStatus(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const map = { active: 'inactive', inactive: 'active', low: 'active' };
        const newStatus = map[item.status] || 'active';
        updateItem(id, { status: newStatus });
      }

      function bulkUpdateStatus(ids, status) {
        const count = ids.length;
        items = items.map(item => {
          if (ids.includes(item.id)) {
            return { ...item, status };
          }
          return item;
        });
        selectedItems.clear();
        render();
        showToast('Updated', `${count} items set to ${status}`, 'success');
      }

      function duplicateItem(id) {
        const original = items.find(i => i.id === id);
        if (!original) return;
        const copy = {
          ...original,
          id: `p${nextId++}`,
          name: `${original.name} (Copy)`,
          sku: `${original.sku}-COPY`,
          quantity: 0
        };
        items = [copy, ...items];
        render();
        showToast('Duplicated', 'Product copied successfully', 'success');
      }

      // ---------- EVENT HANDLING ----------
      // Grid actions
      grid.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const id = btn.dataset.id;
        const action = btn.dataset.action;

        if (action === 'delete') {
          if (confirm('Delete this item?')) deleteItem(id);
        } else if (action === 'toggle') {
          toggleStatus(id);
        } else if (action === 'edit') {
          const item = items.find(i => i.id === id);
          if (item) openModal(item);
        } else if (action === 'duplicate') {
          duplicateItem(id);
        }
      });

      // Checkboxes
      grid.addEventListener('change', (e) => {
        if (e.target.classList.contains('product-checkbox')) {
          const id = e.target.dataset.id;
          if (e.target.checked) {
            selectedItems.add(id);
          } else {
            selectedItems.delete(id);
          }
          render();
        }
      });

      // Filters
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          currentPage = 1;
          render();
        });
      });

      statCards.forEach(card => {
        card.addEventListener('click', () => {
          currentFilter = card.dataset.filter;
          currentPage = 1;
          render();
        });
      });

      // Search
      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        currentPage = 1;
        render();
      });

      // Pagination
      prevPageBtn.addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; render(); }
      });

      nextPageBtn.addEventListener('click', () => {
        const total = items.filter(i => {
          if (currentFilter === 'active') return i.status === 'active';
          if (currentFilter === 'low') return i.quantity <= 5 && i.status !== 'inactive';
          if (currentFilter === 'inactive') return i.status === 'inactive';
          return true;
        }).length;
        const totalPages = Math.ceil(total / itemsPerPage);
        if (currentPage < totalPages) { currentPage++; render(); }
      });

      // Bulk actions
      bulkActive.addEventListener('click', () => {
        if (selectedItems.size > 0) bulkUpdateStatus(Array.from(selectedItems), 'active');
      });

      bulkLow.addEventListener('click', () => {
        if (selectedItems.size > 0) bulkUpdateStatus(Array.from(selectedItems), 'low');
      });

      bulkDelete.addEventListener('click', () => {
        if (selectedItems.size === 0) return;
        if (confirm(`Delete ${selectedItems.size} items?`)) {
          deleteItems(Array.from(selectedItems));
        }
      });

      bulkClear.addEventListener('click', () => {
        selectedItems.clear();
        render();
      });

      // ---------- MODAL ----------
      function openModal(item = null) {
        if (item) {
          editingId = item.id;
          modalTitle.textContent = 'Edit Product';
          nameInput.value = item.name || '';
          skuInput.value = item.sku || '';
          descInput.value = item.description || '';
          qtyInput.value = item.quantity || 0;
          statusSelect.value = item.status || 'active';
          categorySelect.value = item.category || 'Other';
          supplierInput.value = item.supplier || '';
          costInput.value = item.cost || '';
          priceInput.value = item.price || '';
          reorderInput.value = item.reorderPoint || 5;
        } else {
          editingId = null;
          modalTitle.textContent = 'Add Product';
          form.reset();
          nameInput.value = '';
          skuInput.value = '';
          descInput.value = '';
          qtyInput.value = 1;
          statusSelect.value = 'active';
          categorySelect.value = 'Other';
          supplierInput.value = '';
          costInput.value = '';
          priceInput.value = '';
          reorderInput.value = 5;
        }
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.remove('show');
        document.body.style.overflow = '';
        editingId = null;
      }

      addBtn.addEventListener('click', () => openModal(null));
      cancelBtn.addEventListener('click', closeModal);
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
      });

      // Form submit
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        const sku = skuInput.value.trim();
        if (!name || !sku) {
          showToast('Error', 'Name and SKU are required', 'error');
          return;
        }

        const data = {
          name,
          sku,
          description: descInput.value.trim(),
          quantity: parseInt(qtyInput.value) || 0,
          status: statusSelect.value,
          category: categorySelect.value,
          supplier: supplierInput.value.trim(),
          cost: parseFloat(costInput.value) || 0,
          price: parseFloat(priceInput.value) || 0,
          reorderPoint: parseInt(reorderInput.value) || 5
        };

        if (editingId) {
          updateItem(editingId, data);
        } else {
          // Check duplicate SKU
          if (items.some(i => i.sku.toLowerCase() === sku.toLowerCase())) {
            showToast('Warning', 'SKU already exists', 'warning');
            return;
          }
          addItem(data);
        }
        closeModal();
      });

      saveBtn.addEventListener('click', (e) => {
        e.preventDefault();
        form.dispatchEvent(new Event('submit', { bubbles: true }));
      });

      // ---------- EXPORT ----------
      exportBtn.addEventListener('click', () => {
        const data = JSON.stringify(items, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inventory-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported', 'Data exported successfully', 'success');
      });

      // ---------- KEYBOARD SHORTCUTS ----------
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
          e.preventDefault();
          searchInput.focus();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
          e.preventDefault();
          openModal(null);
        }
      });

      // ---------- INIT ----------
      render();

      console.log('📦 Inventory Management loaded');
      console.log(`📊 ${items.length} items ready`);

    })();
  </script>
</body>
</html>
